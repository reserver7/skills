name: Auto Release on Tag

on:
  push:
    tags:
      - 'skills-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for main ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Validate and package tagged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -B -m unittest discover -s grounded/setup -p 'test_*.py'
          python3 grounded/setup/manage.py check
          VERSION="${TAG#skills-v}"
          python3 grounded/setup/release.py package \
            --tag "$TAG" \
            --output "$RUNNER_TEMP/grounded-${VERSION}.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#skills-v}"
          gh release create "$TAG" "$RUNNER_TEMP/grounded-${VERSION}.zip" \
            --verify-tag \
            --title "Grounded v$VERSION" \
            --notes "For rationale and measured results, see [CHANGELOG.md](https://github.com/reserver7/skills/blob/main/CHANGELOG.md)." \
            --generate-notes
